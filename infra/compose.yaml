services:
    database:
        container_name: "postgres-dev"
        image: "postgres:18-alpine"
        env_file:
            - ../.env.development
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 2s
            timeout: 5s
            retries: 10
